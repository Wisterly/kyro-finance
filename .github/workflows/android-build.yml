name: Gerar Aplicativo Android (KYRO Finance APK)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'dist_kyro_analise/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/promote-release.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'dist_kyro_analise/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar KYRO Finance APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências Web e Capacitor
        run: npm install --legacy-peer-deps || npm install

      - name: Compilar Projeto Web (Vite + TypeScript)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Sincronizar arquivos Web com o pacote Android (Capacitor)
        run: npx cap sync android

      - name: Configurar Java JDK 21 para Android Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Otimizado (Debug e Release Assinados)
        working-directory: ./android
        env:
          KEYSTORE_FILE: 'kyro.keystore'
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BUILD_CODE=$(node -p "require('../version.json').buildNumber || 28")
          VERSION_NAME=$(node -p "require('../version.json').version || '1.28'")
          echo "Compilando KYRO Finance com versionCode=$BUILD_CODE versionName=$VERSION_NAME"
          echo "BUILD_CODE=$BUILD_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          ./gradlew assembleDebug assembleRelease -PversionCode=$BUILD_CODE -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-${VERSION_NAME}.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-1.${BUILD_CODE}.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-v1.${BUILD_CODE}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../KYRO-Finance-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../KYRO-Finance-${VERSION_NAME}-debug.apk

      - name: Gerar Manifesto Criptográfico e Registrar SHA de Origem
        run: |
          sha256sum KYRO-Finance*.apk > build-sha256.txt
          RELEASE_SHA=$(sha256sum KYRO-Finance.apk | awk '{print $1}')
          cat <<EOF > build-manifest.json
          {
            "commit_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "build_code": "${{ env.BUILD_CODE }}",
            "version_name": "${{ env.VERSION_NAME }}",
            "created_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256_release_apk": "$RELEASE_SHA",
            "status": "CANDIDATE_READY_FOR_REVIEW"
          }
          EOF
          echo "--- MANIFESTO DO CANDIDATO ---"
          cat build-manifest.json
          echo "--- HASHES SHA-256 ---"
          cat build-sha256.txt

      - name: Arquivar APK e Manifesto como Artefato de Revisão (Aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: KYRO-Finance-APK
          path: |
            KYRO-Finance*.apk
            build-manifest.json
            build-sha256.txt
          if-no-files-found: error

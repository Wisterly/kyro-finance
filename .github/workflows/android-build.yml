name: Gerar Aplicativo Android (KYRO Finance APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar KYRO Finance APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências Web e Capacitor
        run: npm install --legacy-peer-deps || npm install

      - name: Compilar Projeto Web (Vite + TypeScript)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Sincronizar arquivos Web com o pacote Android (Capacitor)
        run: npx cap sync android

      - name: Configurar Java JDK 21 para Android Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Otimizado (Debug e Release Assinados)
        working-directory: ./android
        run: |
          BUILD_CODE=$(node -p "require('../version.json').buildNumber || 28")
          VERSION_NAME=$(node -p "require('../version.json').version || '1.28'")
          echo "Compilando KYRO Finance com versionCode=$BUILD_CODE versionName=$VERSION_NAME"
          echo "BUILD_CODE=$BUILD_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          ./gradlew assembleDebug assembleRelease -PversionCode=$BUILD_CODE -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-${VERSION_NAME}.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-1.${BUILD_CODE}.apk
          cp app/build/outputs/apk/release/app-release.apk ../KYRO-Finance-v1.${BUILD_CODE}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../KYRO-Finance-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../KYRO-Finance-${VERSION_NAME}-debug.apk

      - name: Disponibilizar KYRO-Finance.apk na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: KYRO-Finance-APK
          path: |
            KYRO-Finance*.apk
          if-no-files-found: error

      - name: Publicar APK pronto para download direto em Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "📱 KYRO Finance v${{ env.VERSION_NAME }} (Build ${{ env.BUILD_CODE }})"
          body: |
            ### 🚀 Aplicativo Oficial Android — KYRO | Private Finance
            - **Download da Versão Atualizada:** Baixe o arquivo **`KYRO-Finance-1.${{ env.BUILD_CODE }}.apk`** abaixo para instalar ou atualizar diretamente no seu celular Android.
            - **Versão:** v${{ env.VERSION_NAME }} (Build ${{ env.BUILD_CODE }})
            - **Sincronização 24h:** Conectado automaticamente ao banco central e WhatsApp na Vercel (`https://kyro-finance.vercel.app`).
            - **Carregamento Instantâneo:** Interface empacotada nativamente na memória do aparelho.
          files: |
            KYRO-Finance.apk
            KYRO-Finance-*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
